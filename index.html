# this is an empty front matter
---
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>{{ site.github.project_title }}</title>
    <meta name="description" content="{{ site.github.project_tagline }}" />
    <meta name="author" content="{{ site.github.owner_name }}">
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="/" />
    <meta name="twitter:title" content="{{ site.github.project_tagline }}" />
    <meta name="twitter:description" content="{{ site.github.project_tagline }}" />
    <meta name="twitter:image" content="./icon.png" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="{{ site.github.project_title }}">
    <meta name="apple-mobile-web-app-status-bar-style" content="translucent-black">
    <meta name="format-detection" content="telephone=no">
    <meta name="application-name" content="{{ site.github.project_title }}">
    <meta name="theme-color" content="#000">
    <meta property="og:title" content="{{ site.github.project_title }}" />
    <meta property="og:site_name" content="{{ site.github.project_title }}" />
    <meta property="og:description" content="{{ site.github.project_tagline }}" />
    <meta property="og:image" content="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="shortcut icon" href="./icon.png">
    <!-- loader.js is removed here to stop it from forcing the simulator skin layout -->
    <script type="text/javascript" src="./assets/js/custom.js?v={{ site.github.build_revision }}"></script>
    <style>
        html, body {
            background: black;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        footer {
            display: none !important;
        }
    </style>
</head>

<body>
    <iframe id="simframe" allowfullscreen="allowfullscreen" sandbox="allow-popups allow-forms allow-scripts allow-same-origin"></iframe>

    <script type="text/javascript">
        // Extract project ID directly from the current GitHub Pages repository name
        var repoName = window.location.pathname.split('/')[1] || "";
        
        // Fallback target query check if launched from custom domains
        if(!repoName || repoName === "index.html") {
            repoName = "{{ site.github.repository_name }}";
        }

        // Generate clean fullscreen arcade layout link
        var cleanUrl = "https://makecode.com" + repoName + "&embed=1&hideSimButtons=1&fullscreen=1&nofooter=1&autofocus=1";
        document.getElementById('simframe').src = cleanUrl;
    </script>
</body>
</html>
